<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e0d0c">
<title>Sartaroshxona</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Oswald:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0e0d0c;--surface:#171513;--surface2:#1f1c19;--surface3:#272320;--line:#2e2a25;
    --text:#f4efe6;--muted:#9a9186;--gold:#d4a853;--gold2:#b8893a;--gold-g:linear-gradient(135deg,#e3bd6a 0%,#c4973f 100%);
    --ok:#4cc38a;--ok-l:rgba(76,195,138,.14);--warn:#e5a93d;--warn-l:rgba(229,169,61,.14);--bad:#ef6b6b;--bad-l:rgba(239,107,107,.14);
    --top-bg:rgba(14,13,12,.82);--nav-bg:rgba(28,25,22,.88);--past-bg:#1a1816;--past-txt:#4f4941;--dayoff-bg:#221f1c;--dayoff-txt:#6f685e;
    --meta-txt:#cfc7ba;--star-off:#3d372f;--card-shadow:0 10px 30px rgba(0,0,0,.35);--glow:rgba(212,168,83,.10);
    --r:18px;--font:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--head:"Oswald","Inter",system-ui,sans-serif;
  }
  html.light{
    --bg:#f5f3ef;--surface:#ffffff;--surface2:#f0ece4;--surface3:#e5dfd3;--line:#dfd8cb;
    --text:#1c1915;--muted:#6e675f;--gold:#b88628;--gold2:#9a6d1a;--gold-g:linear-gradient(135deg,#dfb660 0%,#be8e30 100%);
    --ok:#1e9e63;--ok-l:rgba(30,158,99,.13);--warn:#c98518;--warn-l:rgba(201,133,24,.14);--bad:#dc4c4c;--bad-l:rgba(220,76,76,.13);
    --top-bg:rgba(245,243,239,.86);--nav-bg:rgba(255,255,255,.92);--past-bg:#ece8e0;--past-txt:#aba398;--dayoff-bg:#e8e3d9;--dayoff-txt:#8c8479;
    --meta-txt:#4a443d;--star-off:#d4cec2;--card-shadow:0 8px 24px rgba(28,25,21,.07);--glow:rgba(212,168,83,.16);
    color-scheme:light;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html{background:var(--bg);-webkit-text-size-adjust:100%;color-scheme:dark;transition:background .2s,color .2s}
  body{font-family:var(--font);color:var(--text);min-height:100vh;line-height:1.45;background:
    radial-gradient(900px 420px at 85% -120px,var(--glow),transparent 70%),var(--bg)}
  svg{width:18px;height:18px;flex:none}
  .wrap{max-width:1040px;margin:0 auto;padding:0 16px calc(104px + env(safe-area-inset-bottom))}
  h1,h2,h3{font-weight:600}
  h1{font-family:var(--head);font-size:22px;letter-spacing:1.2px;text-transform:uppercase}
  h2{font-family:var(--head);font-size:17px;letter-spacing:.8px;text-transform:uppercase;margin-bottom:14px;display:flex;align-items:center;gap:10px}
  h2::before{content:"";width:3px;height:16px;border-radius:2px;background:var(--gold-g)}
  h3{font-size:17px;letter-spacing:-.1px}
  .hint{color:var(--muted);font-size:13px}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;margin-bottom:16px;box-shadow:var(--card-shadow)}
  label{display:block;font-size:12px;font-weight:600;letter-spacing:.6px;text-transform:uppercase;color:var(--muted);margin:14px 0 6px}
  input,select{width:100%;height:48px;padding:0 14px;border:1px solid var(--line);border-radius:12px;font-size:16px;background:var(--surface2);color:var(--text);font-family:inherit;transition:border-color .15s,box-shadow .15s}
  input::placeholder{color:var(--muted);opacity:.75}
  input:focus,select:focus{outline:0;border-color:var(--gold);box-shadow:0 0 0 4px rgba(212,168,83,.16)}
  select option{background:var(--surface);color:var(--text)}
  input[type=checkbox]{accent-color:var(--gold)}

  /* buttons */
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:48px;padding:0 22px;border:0;border-radius:12px;font-family:inherit;font-size:15px;font-weight:600;cursor:pointer;white-space:nowrap;transition:transform .12s,filter .15s,background .15s;user-select:none}
  .btn:active{transform:scale(.98)}
  .btn:disabled{opacity:.5}
  .btn.block{width:100%;margin-top:16px}
  .btn.sm{height:38px;padding:0 14px;font-size:13.5px;border-radius:10px}
  .btn.primary{background:var(--gold-g);color:#1b1408;box-shadow:0 8px 20px rgba(212,168,83,.22)}
  .btn.primary:hover{filter:brightness(1.06)}
  .btn.success{background:linear-gradient(135deg,#3fcf8e,#22a468);color:#06210f}
  .btn.outline{background:transparent;color:var(--gold);box-shadow:inset 0 0 0 1.5px var(--gold)}
  .btn.outline:hover,.btn.soft:hover{background:rgba(212,168,83,.1)}
  .btn.soft{background:var(--surface2);color:var(--gold);box-shadow:inset 0 0 0 1px var(--line)}
  .btn.ghost{background:transparent;color:var(--text);box-shadow:inset 0 0 0 1px var(--line)}
  .btn.ghost:hover{background:var(--surface2)}
  .btn.danger{color:var(--bad)}
  .link{background:none;border:0;color:var(--gold);padding:8px 2px;font-family:inherit;font-weight:600;font-size:14px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
  .link:hover{text-decoration:underline}
  .iconbtn{width:42px;height:42px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--text);display:grid;place-items:center;cursor:pointer;transition:.15s}
  .iconbtn:hover{background:var(--surface2)}

  .err{background:var(--bad-l);color:var(--bad);padding:12px 14px;border-radius:12px;font-size:14px;margin-top:14px;border:1px solid rgba(239,107,107,.3)}
  .okmsg{background:var(--ok-l);color:var(--ok);padding:12px 14px;border-radius:12px;font-size:14px;margin-bottom:14px;border:1px solid rgba(76,195,138,.3)}

  /* auth */
  .auth{max-width:430px;margin:0 auto;padding:24px 0 30px}
  .auth-top{display:flex;justify-content:flex-end;margin-bottom:10px}
  .brand{text-align:center;margin-bottom:26px}
  .brand .logo{width:76px;height:76px;border-radius:24px;background:var(--gold-g);color:#1b1408;display:grid;place-items:center;margin:0 auto 16px;box-shadow:0 14px 34px rgba(212,168,83,.3)}
  .brand .logo svg{width:36px;height:36px}
  .brand p{color:var(--muted);margin-top:6px;font-size:14px}
  .seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--surface2);padding:5px;border-radius:14px;border:1px solid var(--line)}
  .seg button{height:42px;border:0;border-radius:10px;background:transparent;color:var(--muted);font-family:inherit;font-size:14px;font-weight:600;cursor:pointer;transition:.15s;display:inline-flex;align-items:center;justify-content:center;gap:8px}
  .seg button.on{background:var(--gold-g);color:#1b1408}
  .pw{position:relative}.pw input{padding-right:48px}
  .pw button{position:absolute;right:6px;top:50%;transform:translateY(-50%);background:none;border:0;color:var(--muted);width:38px;height:38px;display:grid;place-items:center;cursor:pointer}

  /* top bar */
  .top{position:sticky;top:0;z-index:20;margin:0 -16px 18px;padding:12px 16px;display:flex;align-items:center;gap:10px;background:var(--top-bg);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
  .top .lg{width:42px;height:42px;border-radius:12px;background:var(--gold-g);color:#1b1408;display:grid;place-items:center}
  .top .who{flex:1;min-width:0}
  .top .who b{display:block;font-family:var(--head);letter-spacing:1px;text-transform:uppercase;font-size:17px;font-weight:600}
  .top .who span{font-size:12px;color:var(--muted);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .live{display:inline-flex;align-items:center;gap:6px;color:var(--ok);font-weight:600}
  .live::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--ok);animation:p 1.5s infinite}
  @keyframes p{50%{opacity:.3}}

  /* bottom nav */
  .bnav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom));z-index:25;display:flex;gap:4px;padding:6px;background:var(--nav-bg);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid var(--line);border-radius:22px;box-shadow:0 18px 40px rgba(0,0,0,.28);width:min(560px,calc(100% - 24px))}
  .bnav button{flex:1;min-width:0;position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 2px 8px;border:0;border-radius:16px;background:transparent;color:var(--muted);font-family:inherit;font-size:11px;font-weight:600;cursor:pointer;transition:.15s}
  .bnav button svg{width:22px;height:22px}
  .bnav button span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
  .bnav button.on{background:var(--gold-g);color:#1b1408}
  .nb{position:absolute;top:4px;right:calc(50% - 26px);background:var(--bad);color:#fff;font-size:10px;font-weight:700;min-width:17px;height:17px;border-radius:9px;display:grid;place-items:center;padding:0 4px}

  /* search */
  .srow{display:grid;grid-template-columns:1fr auto;gap:10px;margin-bottom:10px}
  .inwrap{position:relative}.inwrap svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none}
  .inwrap input{padding-left:44px}
  .chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
  .chip{height:36px;padding:0 14px;border:0;border-radius:20px;background:var(--surface2);color:var(--muted);font-family:inherit;font-size:13px;font-weight:600;cursor:pointer;box-shadow:inset 0 0 0 1px var(--line);display:inline-flex;align-items:center;gap:6px}
  .chip svg{width:15px;height:15px}
  .chip.on{background:var(--gold);color:#1b1408;box-shadow:none}

  /* post cards */
  .grid{display:grid;gap:18px;grid-template-columns:repeat(auto-fill,minmax(min(100%,310px),1fr))}
  .post{padding:0;overflow:hidden;margin:0;cursor:pointer;transition:transform .18s,border-color .18s,box-shadow .18s}
  .post:hover{transform:translateY(-4px);border-color:rgba(212,168,83,.55);box-shadow:0 20px 44px rgba(0,0,0,.22)}
  .post.static{cursor:default}.post.static:hover{transform:none;border-color:var(--line);box-shadow:var(--card-shadow)}
  .coverwrap{position:relative;height:176px;overflow:hidden;background:var(--surface2)}
  .cover{position:absolute;inset:0;background-size:cover;background-position:center}
  .cover.art{display:grid;place-items:center;background:linear-gradient(135deg,hsl(var(--h) 28% 22%),hsl(var(--h) 30% 11%))}
  .cover.art svg{width:92px;height:92px;color:hsl(var(--h) 60% 65%);opacity:.25;transform:rotate(-14deg)}
  .cover.art::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(-45deg,transparent 0 22px,rgba(255,255,255,.03) 22px 44px)}
  .cov-grad{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.35) 0%,transparent 40%,rgba(0,0,0,.72) 100%)}
  .cov-top{position:absolute;left:12px;right:12px;top:12px;display:flex;gap:6px;align-items:center}
  .cov-top .sp{flex:1}
  .cov-bot{position:absolute;left:14px;right:14px;bottom:12px;display:flex;justify-content:space-between;align-items:flex-end;gap:8px}
  .rbadge{display:inline-flex;align-items:center;gap:5px;background:rgba(14,13,12,.75);backdrop-filter:blur(8px);padding:5px 10px;border-radius:20px;font-size:13px;font-weight:700;color:#e3bd6a;border:1px solid rgba(255,255,255,.08)}
  .rbadge small{color:#cfc7ba;font-weight:500}
  .dbadge{background:rgba(14,13,12,.75);backdrop-filter:blur(8px);padding:5px 10px;border-radius:20px;font-size:12px;font-weight:600;color:#fff;border:1px solid rgba(255,255,255,.08)}
  .fav{width:38px;height:38px;border-radius:50%;border:0;background:rgba(14,13,12,.68);backdrop-filter:blur(8px);color:#fff;display:grid;place-items:center;cursor:pointer;transition:transform .12s}
  .fav:active{transform:scale(.9)}
  .fav.on{color:#ff6b7d}.fav.on svg{fill:#ff6b7d}
  .pbody{padding:16px 18px 18px}
  .pbody h3{margin-bottom:8px}
  .meta{display:flex;gap:9px;align-items:flex-start;font-size:13.5px;color:var(--meta-txt);margin-top:6px}
  .meta svg{width:16px;height:16px;color:var(--gold);margin-top:2px}
  .meta a{color:var(--gold);font-weight:600;text-decoration:none;margin-left:6px;font-size:12.5px}
  .tag{display:inline-block;background:var(--surface2);color:var(--muted);font-size:12px;font-weight:600;padding:4px 10px;border-radius:8px;margin:2px 4px 2px 0;border:1px solid var(--line)}
  .tag.on{color:var(--gold);border-color:rgba(212,168,83,.45)}
  .tag.me{background:var(--ok-l);color:var(--ok);border-color:transparent}
  .tag.top{background:var(--gold-g);color:#1b1408;border:0}
  .svc{margin-top:12px;padding-top:12px;border-top:1px dashed var(--line)}
  .svc .h{font-size:11px;letter-spacing:.8px;text-transform:uppercase;color:var(--muted);font-weight:600;margin-bottom:4px}
  .svc .s{display:flex;justify-content:space-between;gap:10px;font-size:14px;padding:5px 0}
  .svc .s b{color:var(--gold);font-weight:600;white-space:nowrap}
  .manage{display:flex;gap:10px;margin-top:16px}.manage .btn{flex:1}
  .pill{display:inline-block;font-size:12px;font-weight:700;padding:4px 10px;border-radius:20px}
  .pill.pending{background:var(--warn-l);color:var(--warn)}
  .pill.confirmed,.pill.done{background:var(--ok-l);color:var(--ok)}
  .pill.rejected,.pill.cancelled{background:var(--bad-l);color:var(--bad)}

  .days{display:flex;flex-wrap:wrap;gap:8px}
  .days label{margin:0;display:flex;align-items:center;gap:8px;background:var(--surface2);padding:0 14px;height:42px;border-radius:10px;color:var(--text);cursor:pointer;font-weight:500;font-size:14px;text-transform:none;letter-spacing:0;border:1px solid var(--line)}
  .days label:has(input:checked){border-color:var(--gold);color:var(--gold);background:rgba(212,168,83,.1)}
  .days input{width:auto;height:auto}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .sec{margin-top:22px;padding-top:6px;border-top:1px dashed var(--line)}
  .locrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:10px}
  .service-item{display:grid;grid-template-columns:1fr 130px auto;gap:8px;margin-bottom:8px;align-items:center}
  .service-check{display:flex;align-items:center;justify-content:space-between;background:var(--surface2);padding:12px 14px;border-radius:12px;border:1px solid var(--line);margin-bottom:8px;cursor:pointer;font-size:14px;gap:10px}
  .service-check:has(input:checked){border-color:var(--gold)}
  .service-check input{width:auto;height:auto}
  .photo{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-top:6px}
  .photo .pv{width:120px;height:80px;border-radius:12px;background:var(--surface2) center/cover;border:1px dashed var(--line);display:grid;place-items:center;color:var(--muted)}
  .photo input[type=file]{display:none}

  .rate{display:inline-flex;gap:2px}
  .rate button{background:none;border:0;font-size:32px;line-height:1;color:var(--star-off);cursor:pointer;padding:2px 3px;transition:transform .1s}
  .rate button.on{color:var(--gold)}
  .rate button:hover{transform:scale(1.15)}

  /* calendar */
  .weeknav{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;gap:8px}
  .weeknav b{font-family:var(--head);letter-spacing:1px;font-size:16px}
  .cal{overflow-x:auto}
  table{border-collapse:separate;border-spacing:4px;width:100%;min-width:640px}
  th{font-size:11px;color:var(--muted);font-weight:600;padding:4px;text-transform:uppercase;letter-spacing:.6px}
  th b{display:block;font-size:16px;color:var(--text);font-family:var(--head);letter-spacing:0}
  td.t{font-size:12px;color:var(--muted);text-align:right;padding-right:6px;white-space:nowrap}
  .cell{background:var(--ok-l);color:var(--ok);font-weight:600;transition:.12s}
  td.cell{height:40px;text-align:center;font-size:12px;border-radius:9px}
  .cell.free{cursor:pointer}
  .cell.free:hover{background:var(--ok);color:#fff}
  td.cell.closed{background:transparent}
  .cell.past{background:var(--past-bg);color:var(--past-txt);font-weight:400}
  .cell.busy{background:var(--surface3);color:var(--muted)}
  .cell.pend{background:var(--warn-l);color:var(--warn);box-shadow:inset 0 0 0 1px rgba(229,169,61,.4)}
  .cell.conf,.cell.mine{background:var(--gold-g);color:#1b1408}
  .cell.conf{cursor:pointer}
  .cell.done{background:var(--ok-l);color:var(--ok)}
  .cell.dayoff{background:var(--dayoff-bg);color:var(--dayoff-txt);font-weight:500}
  .desk{display:block}.mob{display:none}
  .dchips{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-bottom:14px}
  .dchip{border:1px solid var(--line);border-radius:12px;background:var(--surface2);color:var(--muted);padding:8px 0;font-family:inherit;font-size:10.5px;font-weight:600;cursor:pointer;text-transform:uppercase}
  .dchip b{display:block;font-size:17px;color:var(--text);margin-top:2px;font-family:var(--head)}
  .dchip.on{background:var(--gold-g);color:#1b1408;border-color:transparent}.dchip.on b{color:#1b1408}
  .dchip.off{opacity:.35}
  .mslots{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .mc{border-radius:12px;padding:10px 4px;text-align:center;font-size:12px;display:flex;flex-direction:column;gap:2px;min-height:56px;justify-content:center}
  .mc b{font-size:15px}

  /* modal */
  .modal{position:fixed;inset:0;background:rgba(0,0,0,.62);backdrop-filter:blur(5px);display:grid;place-items:center;padding:16px;z-index:40;overflow:auto}
  .modal .box{background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:24px;width:100%;max-width:430px;box-shadow:0 30px 70px rgba(0,0,0,.4)}
  .amount{text-align:center;margin:12px 0 16px}
  .amount b{display:block;font-family:var(--head);font-size:34px;color:var(--gold);letter-spacing:.5px}
  .amount span{font-size:13px;color:var(--muted)}
  .ccard{background:linear-gradient(135deg,#2f2a23 0%,#0f0e0d 100%);border:1px solid rgba(212,168,83,.35);border-radius:20px;padding:20px 20px 18px;color:#fff;box-shadow:0 18px 36px rgba(0,0,0,.28);position:relative;overflow:hidden}
  .ccard::after{content:"";position:absolute;right:-50px;top:-50px;width:170px;height:170px;border-radius:50%;background:rgba(212,168,83,.12)}
  .ccard small{color:#e3bd6a;font-size:11px;letter-spacing:1.4px;text-transform:uppercase;font-weight:600}
  .ccard .num{font-family:var(--head);font-size:23px;font-weight:500;letter-spacing:2px;margin:14px 0 12px;font-variant-numeric:tabular-nums}
  .ccard .holder{font-size:14px;color:#cfc7ba;padding-right:110px;text-transform:uppercase;letter-spacing:.5px}
  .copy{position:absolute;right:14px;bottom:14px;z-index:1;background:rgba(212,168,83,.2);color:#e3bd6a;border:0;border-radius:10px;height:36px;padding:0 12px;font-family:inherit;font-size:13px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
  .copy svg{width:15px;height:15px}
  .sum .r{display:flex;justify-content:space-between;gap:10px;padding:11px 0;border-bottom:1px solid var(--line);font-size:15px}
  .sum .r:last-child{border:0}
  .sum .r span:first-child{color:var(--muted)}
  .list .it{display:flex;justify-content:space-between;gap:12px;padding:16px 0;border-bottom:1px solid var(--line);font-size:14px}
  .list .it:last-child{border:0}
  .req{border:1px solid rgba(229,169,61,.4);background:var(--warn-l);border-radius:16px;padding:16px;margin-bottom:12px}
  .req .head{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:flex-start}
  .req .acts{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
  .req .acts .btn{flex:1;min-width:140px}
  .empty{text-align:center;color:var(--muted);padding:34px 10px}
  .empty b{color:var(--text);font-size:18px;display:block;margin-top:10px}
  .empty svg{width:42px;height:42px;color:var(--gold);opacity:.7}
  .stat{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-bottom:16px}
  .stat .s{background:var(--surface2);border:1px solid var(--line);border-radius:14px;padding:14px}
  .stat .s b{display:block;font-family:var(--head);font-size:28px;color:var(--gold);letter-spacing:.5px}
  .stat .s span{font-size:12px;color:var(--muted)}
  .splash{display:grid;place-items:center;min-height:70vh;color:var(--gold)}

async function hash(s){
  if(window.crypto&&crypto.subtle){
    const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));
    return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');
  }
  return 'p:'+s;
}

}

function pickPhoto(inp){
  const f=inp.files&&inp.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=()=>{const im=new Image();im.onload=()=>{
    const sc=Math.min(1,640/im.width),c=document.createElement('canvas');c.width=Math.round(im.width*sc);c.height=Math.round(im.height*sc);
    c.getContext('2d').drawImage(im,0,0,c.width,c.height);
    const p=readForm();p.photo=c.toDataURL('image/jpeg',.65);S.draft=p;render()};im.src=r.result};
  r.readAsDataURL(f);
}
function removePhoto(){const p=readForm();delete p.photo;S.draft=p;render()}
function readForm(){
  const base=S.draft||load().posts[S.user.login]||{};

  document.querySelectorAll('#services_container .service-item').forEach(row=>{
    const name=row.querySelector('.srv-name')?.value.trim(),price=+row.querySelector('.srv-price')?.value;
    if(name&&price>0)services.push({name,price});
  });
  return {shop:val('p_shop'),address:val('p_addr'),phone:val('p_phone'),price:+val('p_price'),district:val('p_dist'),
    days:[...document.querySelectorAll('.p_day:checked')].map(x=>+x.value),from:val('p_from'),to:val('p_to'),slot:+val('p_slot'),
    card:val('p_card').replace(/\D/g,''),holder:val('p_holder'),lat:base.lat,lng:base.lng,photo:base.photo,
    subUntil:base.subUntil||(Date.now()+30*24*3600*1000),isSuspended:base.isSuspended||false,
    services:services.length?services:[{name:'Soch kesish',price:+val('p_price')||50000}]};
}
function savePost(){
  const p=readForm(),bad=m=>{S.err=m;S.draft=p;render()};
  if(p.shop.length<2)return bad('Sartaroshxona nomini kiriting');
  if(!p.district)return bad('Tumanni tanlang');
  if(p.address.length<3)return bad('Manzilni kiriting');
  if(p.phone.length<3)return bad("Telefon raqamni to'g'ri kiriting");
  if(!(p.price>=1000))return bad("Xizmat narxini kiriting");
  if(!p.days.length)return bad('Kamida bitta ish kunini tanlang');
  if(!p.from||!p.to||toMin(p.to)-toMin(p.from)<p.slot)return bad("Ish vaqti noto'g'ri");
  if(p.card.length!==16)return bad("Karta raqami 16 ta raqamdan iborat bo'lishi kerak");
  if(p.holder.length<3)return bad('Karta egasining ismini kiriting');
  const db=load();db.posts[S.user.login]={...p,updated:Date.now()};save(db);
  S.err=null;S.draft=null;S.editing=false;S.msg="E'lon saqlandi";render();
}

  return `<div class="card post ${o.static?'static':''}" ${o.static?'':`onclick="openPost('${js(login)}')"`}>
    <div class="coverwrap">${cover(p,login)}<div class="cov-grad"></div>
      <div class="cov-top">${o.top?'<span class="tag top">1-o\'rin</span>':''}${mine?'<span class="tag me">Sizniki</span>':''}<span class="sp"></span>
        ${S.user&&S.user.role==='mijoz'?`<button class="fav ${isFav?'on':''}" onclick="toggleFavorite('${js(login)}',event)">${IC.heart}</button>`:''}</div>
      <div class="cov-bot"><span class="rbadge">${rb}</span>${d!=null?`<span class="dbadge">${d.toFixed(1)} km</span>`:''}</div></div>
    <div class="pbody"><h3>${esc(p.shop)}</h3>
      <div class="meta">${IC.pin}<span>${p.district?esc(p.district)+' tumani · ':''}${esc(p.address)}<a href="${mapUrl}" target="_blank" onclick="event.stopPropagation()">Xaritada</a></span></div>
      <div class="meta">${IC.clock}<span>${p.from}–${p.to} · ${p.slot} daqiqa</span></div>
      <div class="meta">${IC.phone}<span>${esc(p.phone)}</span></div>
      <div style="margin-top:10px">${[0,1,2,3,4,5,6].map(x=>`<span class="tag ${p.days.includes(x)?'on':''}" style="${p.days.includes(x)?'':'opacity:.35'}">${DAYS[x]}</span>`).join('')}</div>
      <div class="svc"><div class="h">Xizmatlar</div>${list.map(s=>`<div class="s"><span>${esc(s.name)}</span><b>${money(s.price)}</b></div>`).join('')}${more>0?`<div class="hint" style="margin-top:2px">+ yana ${more} ta xizmat</div>`:''}</div>
      ${o.own?`<div class="meta" style="margin-top:12px">${IC.card}<span>${esc(mask)} · ${esc(p.holder||'')}</span></div>`:''}
      ${mine?`<div class="manage"><button class="btn outline sm" onclick="event.stopPropagation();editPost()">${IC.edit}Tahrirlash</button>
        <button class="btn ghost sm danger" onclick="event.stopPropagation();deletePost()">${IC.trash}O'chirish</button></div>`:''}</div></div>`;
}

function rating(db,login){const r=db.ratings.filter(x=>x.barber===login);return{n:r.length,avg:r.length?r.reduce((s,x)=>s+x.stars,0)/r.length:0}}
const rateInput=(barber,cur)=>`<span class="rate">${[1,2,3,4,5].map(n=>`<button class="${n<=cur?'on':''}" aria-label="${n} yulduz" onclick="rate('${js(barber)}',${n})">★</button>`).join('')}</span>`;
const canRate=(db,client,barber)=>db.bookings.some(b=>b.client===client&&b.barber===barber&&st(b)==='done');
const myRating=(db,client,barber)=>db.ratings.find(x=>x.client===client&&x.barber===barber)?.stars||0;

function listItems(db){
  const q=S.q.trim().toLowerCase();
  let items=Object.entries(db.posts).filter(([l,p])=>isSubActive(p)).map(([login,p])=>{
    const owner=db.users.find(u=>u.login===login),pos=postPos(p);
    return{login,p,owner,r:rating(db,login),d:(S.pos&&pos)?km(S.pos.lat,S.pos.lng,pos[0],pos[1]):null};
  });
  if(S.onlyFav&&S.user){const f=db.favorites?.[S.user.login]||[];items=items.filter(i=>f.includes(i.login))}
  if(S.dist)items=items.filter(i=>i.p.district===S.dist);
  if(q)items=items.filter(i=>[i.p.shop,i.p.address,i.p.district].join(' ').toLowerCase().includes(q));
  const byRating=(a,b)=>(b.r.avg-a.r.avg)||(b.r.n-a.r.n)||((b.p.updated||0)-(a.p.updated||0));
  if(S.sort==='near'&&S.pos)items.sort((a,b)=>((a.d??1e9)-(b.d??1e9))||byRating(a,b));else items.sort(byRating);
  return items;
}
function allPosts(){
  const db=load(),items=listItems(db),filtered=!!(S.q.trim()||S.dist||S.onlyFav);
  const search=`<div class="card"><h2>Sartaroshxona qidirish</h2>
    <div class="srow"><div class="inwrap">${IC.search}<input id="s_q" type="search" enterkeyhint="search" value="${esc(S.q)}" placeholder="Nomi yoki manzil bo'yicha" onkeydown="if(event.key==='Enter')doSearch()"></div>
      <button class="btn primary" onclick="doSearch()">Qidirish</button></div>
    <div class="srow"><select id="s_dist" onchange="doSearch()"><option value="">Toshkent: barcha tumanlar</option>${Object.keys(DISTRICTS).map(d=>`<option value="${esc(d)}" ${S.dist===d?'selected':''}>${esc(d)} tumani</option>`).join('')}</select>
      <button class="btn soft" onclick="nearMe()">${IC.pin}Menga yaqin</button></div>
    <div class="chips"><button class="chip ${S.sort==='rating'?'on':''}" onclick="sortRating()">${IC.star}Reyting</button>
      <button class="chip ${S.sort==='near'&&S.pos?'on':''}" onclick="nearMe()">${IC.pin}Yaqinlik</button>
      ${S.user&&S.user.role==='mijoz'?`<button class="chip ${S.onlyFav?'on':''}" onclick="toggleOnlyFav()">${IC.heart}Sevimlilar</button>`:''}
      ${(S.q||S.dist||S.pos||S.onlyFav)?`<button class="chip" onclick="clearSearch()">${IC.x}Tozalash</button>`:''}</div></div>`;
  if(!items.length)return search+`<div class="card empty">${IC.search}<b>E'lon yo'q</b>${filtered?"Bu hududda e'lon topilmadi":"Hozircha faol e'lonlar yo'q."}</div>`;
  return search+`<div class="hint" style="margin:0 4px 12px">Toshkent shahri · ${items.length} ta e'lon</div>
    <div class="grid">${items.map((i,k)=>postCard(i,{top:!S.onlyFav&&S.sort==='rating'&&k===0&&i.r.n>0})).join('')}</div>`;
}
function doSearch(){S.q=val('s_q');S.dist=val('s_dist');render()}
function clearSearch(){S.q='';S.dist='';S.sort='rating';S.pos=null;S.onlyFav=false;['s_q','s_dist'].forEach(id=>{if($(id))$(id).value=''});render()}
function sortRating(){S.sort='rating';render()}
function toggleOnlyFav(){S.onlyFav=!S.onlyFav;render()}
function nearMe(){
  S.q=val('s_q');S.dist=val('s_dist');
  if(S.pos){S.sort='near';return render()}
  if(!navigator.geolocation)return toast("Joylashuvni aniqlab bo'lmadi",'bad');
  toast('Joylashuvingiz aniqlanmoqda…');
  navigator.geolocation.getCurrentPosition(pos=>{S.pos={lat:pos.coords.latitude,lng:pos.coords.longitude};S.sort='near';toast("Eng yaqin sartaroshxonalar topildi",'ok');render()},
    ()=>toast("Joylashuvni aniqlab bo'lmadi.",'bad'),{timeout:9000});
}
function openPost(login){S.viewing=login;S.week=0;S.day=null;S.selectedServices=[];render();window.scrollTo({top:0})}

function detailView(login){
  const db=load(),p=db.posts[login];
  if(!p||!isSubActive(p)){S.viewing=null;return allPosts()}
  const canBook=S.user.role==='mijoz',r=rating(db,login);
  const item={login,p,owner:db.users.find(u=>u.login===login),r,d:null};
  let rateBox='';
  if(S.user.role==='mijoz'){
    rateBox=canRate(db,S.user.login,login)?`<div class="card"><h2>Sartaroshni baholang</h2>${rateInput(login,myRating(db,S.user.login,login))}</div>`
      :`<div class="card"><div class="hint">Baholash uchun avval shu sartaroshdan xizmat olishingiz kerak.</div></div>`;
  }
  return `<button class="link" style="margin-bottom:8px" onclick="S.viewing=null;render()">${IC.back}Orqaga</button>
   ${postCard(item,{static:true})}
   <div class="card"><h2>Haftalik kalendar</h2>
    <div class="hint" style="margin-bottom:12px">${canBook?"Bo'sh vaqtni bosing — 50% to'lovdan keyin tasdiqlanadi":"Faqat ko'rish rejimi"}</div>
    ${calendar(login,canBook?'client':'view')}</div>${rateBox}`;
}

/* ---------- CALENDAR ---------- */
function cellOf(login,mode,bk,dm,ds,t,now,isDayOff){
  if(isDayOff)return{cls:'dayoff',label:'Dam olish'};
  const key=ds+'|'+t,b=bk[key],past=new Date(`${ds}T${t}`)<now;
  if(b){
    const pend=st(b)==='pending',first=b.clientPhone;
    if(mode==='barber')return pend?{cls:'pend',label:first,title:`${b.clientPhone}`}:{cls:'conf',label:first,title:`${b.clientPhone}`,click:`finish('${js(b.id)}')`};
    if(b.client===S.user.login)return pend?{cls:'pend',label:'Kutilmoqda'}:{cls:'mine',label:'Sizniki'};
    return{cls:'busy',label:'Band'};
  }
  if(mode==='barber'&&dm[key]&&past)return{cls:'done',label:'Bajarildi'};
  if(past)return{cls:'past',label:'–'};
  if(mode==='client')return{cls:'free',label:"Bo'sh",click:`askBook('${js(login)}','${ds}','${t}')`};
  return{cls:'',label:"Bo'sh"};
}
function selDay(p){
  if(S.day!=null&&p.days.includes(S.day))return S.day;
  const today=(new Date().getDay()+6)%7,wd=[...p.days].sort((a,b)=>a-b);
  return S.week===0?(wd.find(x=>x>=today)??wd[0]):wd[0];
}
function calendar(login,mode){
  const db=load(),p=db.posts[login];if(!p)return `<div class="empty">E'lon yo'q</div>`;
  const ws=weekStart(S.week),dates=[...Array(7)].map((_,i)=>{const d=new Date(ws);d.setDate(ws.getDate()+i);return d});
  const times=slotTimes(p),now=new Date(),sd=selDay(p),bk={},dm={};
  db.bookings.filter(b=>b.barber===login).forEach(b=>{const k=b.date+'|'+b.time;if(active(b))bk[k]=b;else if(st(b)==='done')dm[k]=b});
  const dayOffs=db.dayOffs?.[login]||[];
  const attrs=c=>`${c.click?`onclick="${c.click}"`:''} ${c.title?`title="${esc(c.title)}"`:''}`;
  const rows=times.map(t=>`<tr><td class="t">${t}</td>${dates.map((d,i)=>{
    if(!p.days.includes(i))return `<td class="cell closed"></td>`;
    const ds=ymd(d),c=cellOf(login,mode,bk,dm,ds,t,now,dayOffs.includes(ds));
    return `<td class="cell ${c.cls}" ${attrs(c)}>${esc(c.label)}</td>`}).join('')}</tr>`).join('');
  const selStr=ymd(dates[sd]),isOff=dayOffs.includes(selStr);
  const mslots=times.map(t=>{const c=cellOf(login,mode,bk,dm,selStr,t,now,isOff);return `<div class="mc cell ${c.cls}" ${attrs(c)}><b>${t}</b><span>${esc(c.label)}</span></div>`}).join('');
  const offBtn=mode==='barber'?`<div style="margin-bottom:14px"><button class="btn ${isOff?'success':'ghost'} sm" onclick="toggleDayOff('${js(login)}','${selStr}')">${isOff?IC.check+'Ish kuni qilish':IC.sun+'Dam olish kuni qilish'}</button></div>`:'';
  const nav=`<div class="weeknav"><button class="btn soft sm" onclick="S.week--;S.day=null;render()">‹ Oldingi</button>
    <b>${ws.getDate()}.${pad(ws.getMonth()+1)} – ${dates[6].getDate()}.${pad(dates[6].getMonth()+1)}</b>
    <button class="btn soft sm" onclick="S.week++;S.day=null;render()">Keyingi ›</button></div>`;
  return `${offBtn}${nav}
   <div class="desk"><div class="cal"><table><tr><th></th>${dates.map((d,i)=>`<th>${DAYS[i]}<b>${d.getDate()}</b></th>`).join('')}</tr>${rows}</table></div></div>
   <div class="mob"><div class="dchips">${dates.map((d,i)=>p.days.includes(i)
      ?`<button class="dchip ${i===sd?'on':''}" onclick="S.day=${i};render()">${DAYS[i]}<b>${d.getDate()}</b></button>`
      :`<button class="dchip off" disabled>${DAYS[i]}<b>${d.getDate()}</b></button>`).join('')}</div>
     <div class="mslots">${mslots}</div></div>`;
}
function toggleDayOff(login,ds){
  const db=load();db.dayOffs=db.dayOffs||{};db.dayOffs[login]=db.dayOffs[login]||[];
  const i=db.dayOffs[login].indexOf(ds);
  if(i>-1){db.dayOffs[login].splice(i,1);toast("Ish kuni belgilandi","ok")}else{db.dayOffs[login].push(ds);toast("Dam olish kuni belgilandi","ok")}
  save(db);render();
}
function myCalendar(){
  const db=load(),login=S.user.login,p=db.posts[login];
  if(!p)return `<div class="card empty">${IC.edit}<b>E'lon yo'q</b><button class="btn primary sm" style="margin-top:14px" onclick="setTab('post')">E'lon joylash</button></div>`;
  const mineB=db.bookings.filter(b=>b.barber===login);
  const pend=mineB.filter(b=>st(b)==='pending').sort((a,b)=>a.created-b.created);
  const conf=mineB.filter(b=>st(b)==='confirmed').sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));
  const reqs=pend.length?`<div class="card"><h2>To'lovni tasdiqlash (${pend.length})</h2>
    ${pend.map(b=>`<div class="req"><div class="head"><div><b>${fmtDate(b.date)} · ${b.time}</b><br><span class="hint">${esc(b.clientPhone)}</span></div>
       <b style="font-size:20px;color:var(--gold);font-family:var(--head)">${money(deposit(b))}</b></div>
       <div class="acts"><button class="btn success" onclick="decide('${js(b.id)}','confirmed')">${IC.check}Tasdiqlash</button>
       <button class="btn outline" onclick="decide('${js(b.id)}','rejected')">${IC.x}Rad etish</button></div></div>`).join('')}</div>`:'';
  return `${reqs}<div class="card"><h2>Mening kalendarim</h2>${calendar(login,'barber')}</div>
   <div class="card"><h2>Tasdiqlangan yozuvlar (${conf.length})</h2><div class="list">${conf.length?conf.map(b=>`<div class="it"><div><b>${fmtDate(b.date)} · ${b.time}</b><br><span class="hint">${esc(b.clientPhone)}</span><br>
      <button class="btn success sm" style="margin-top:10px" onclick="finish('${js(b.id)}')">${IC.check}Soch olindi</button></div>
      <div style="text-align:right"><b>${money(b.price)}</b></div></div>`).join(''):'<div class="empty">Yozuvlar yo\'q</div>'}</div></div>`;
}
function decide(id,status){
  const db=load(),b=db.bookings.find(x=>x.id===id);if(!b||st(b)!=='pending')return render();
  b.status=status;b.decidedAt=Date.now();save(db);toast(status==='confirmed'?"Tasdiqlandi":"Rad etildi",'ok');render();
}
function finish(id){
  const db=load(),b=db.bookings.find(x=>x.id===id);if(!b||st(b)!=='confirmed')return render();
  if(!confirm("Soch olindi deb belgilaysizmi?"))return;
  b.status='done';b.doneAt=Date.now();save(db);toast("Soch olindi","ok");render();
}

/* ---------- CLIENT: BOOKINGS ---------- */
function myBookings(){
  const db=load(),mine=db.bookings.filter(b=>b.client===S.user.login).sort((a,b)=>(b.date+b.time).localeCompare(a.date+a.time));
  return `<div class="card"><h2>Mening yozuvlarim</h2><div class="list">${mine.length?mine.map(b=>{const p=db.posts[b.barber],s=st(b);return `<div class="it"><div>
     <b>${fmtDate(b.date)} · ${b.time}</b><br><span class="hint">${esc(p?.shop||b.shop||b.barber)}</span><br>
     <span class="pill ${s}" style="margin-top:8px">${STATUS[s]}</span>
     ${s==='pending'?`<br><button class="link" onclick="cancelBooking('${js(b.id)}')">Bekor qilish</button>`:''}
     ${s==='done'&&p?`<div style="margin-top:10px"><span class="hint">Baholash:</span><br>${rateInput(b.barber,myRating(db,S.user.login,b.barber))}</div>`:''}</div>
     <div style="text-align:right"><b>${money(b.price)}</b></div></div>`}).join(''):`<div class="empty">${IC.calendar}<b>Siz hali yozilmagansiz</b></div>`}</div></div>`;
}
function cancelBooking(id){
  if(!confirm("Bekor qilasizmi?"))return;
  const db=load(),b=db.bookings.find(x=>x.id===id);if(!b||st(b)!=='pending')return render();
  b.status='cancelled';save(db);toast('Bekor qilindi');render();
}
function rate(barber,n){
  const db=load();
  if(!S.user||S.user.role!=='mijoz'||!db.posts[barber]||!canRate(db,S.user.login,barber))return toast("Oldin xizmat olishingiz kerak",'bad');
  const ex=db.ratings.find(x=>x.client===S.user.login&&x.barber===barber);
  if(ex){ex.stars=n;ex.updated=Date.now()}else db.ratings.push({barber,client:S.user.login,stars:n,created:Date.now()});
  save(db);toast(`Rahmat! ${'★'.repeat(n)}`,'ok');render();
}
function toggleServiceSelect(idx){
  const p=load().posts[S.modal.barber],list=p?.services||[{name:'Soch kesish',price:p.price}],t=list[idx];
  const i=S.selectedServices.findIndex(s=>s.name===t.name);
  if(i>-1)S.selectedServices.splice(i,1);else S.selectedServices.push(t);
  render();
}
function askBook(barber,date,time){
  const p=load().posts[barber];
  if(!p?.card){toast("Sartarosh karta kiritmagan",'bad');return}
  const list=p.services||[{name:'Soch kesish',price:p.price}];
  S.selectedServices=[list[0]];S.modal={barber,date,time};render();
}
function payModal(){
  const m=S.modal,p=load().posts[m.barber];if(!p){S.modal=null;return ''}
  const list=p.services||[{name:'Soch kesish',price:p.price}];
  const total=S.selectedServices.length?S.selectedServices.reduce((s,x)=>s+x.price,0):p.price;
  return `<div class="modal" onclick="if(event.target===this){S.modal=null;render()}"><div class="box">
   <h2>To'lov (50%)</h2>
   <div style="max-height:170px;overflow-y:auto;margin-bottom:12px">
     ${list.map((srv,idx)=>{const c=S.selectedServices.some(s=>s.name===srv.name);
       return `<div class="service-check" onclick="toggleServiceSelect(${idx})"><span>${esc(srv.name)} <b style="color:var(--gold);margin-left:4px">${money(srv.price)}</b></span>
         <input type="checkbox" ${c?'checked':''} onclick="event.stopPropagation();toggleServiceSelect(${idx})"></div>`}).join('')}
   </div>
   <div class="sum"><div class="r"><span>Sana</span><span>${fmtDate(m.date)}</span></div><div class="r"><span>Vaqt</span><span>${m.time}</span></div></div>
   <div class="amount"><span>O'tkazish kerak (50%)</span><b>${money(total/2)}</b></div>
   <div class="ccard"><small>Karta</small><div class="num">${esc(fmtCard(p.card))}</div><div class="holder">${esc(p.holder||'')}</div><button class="copy" onclick="copyCard('${js(p.card)}')">${IC.copy}Nusxa</button></div>
   <button class="btn primary block" onclick="paid()">To'lab qo'ydim</button>
   <button class="btn ghost block" style="margin-top:10px" onclick="S.modal=null;render()">Bekor qilish</button></div></div>`;
}
function copyCard(c){try{navigator.clipboard.writeText(c).then(()=>toast('Karta nusxalandi','ok'))}catch(e){}}
function paid(){
  const m=S.modal,db=load(),p=db.posts[m.barber];
  if(!p){S.modal=null;return render()}
  if(db.bookings.some(b=>b.barber===m.barber&&b.date===m.date&&b.time===m.time&&active(b))||(db.dayOffs?.[m.barber]||[]).includes(m.date)||new Date(`${m.date}T${m.time}`)<new Date()){
    S.modal=null;toast("Bu vaqt band qilingan yoki mavjud emas",'bad');return render();
  }
  const list=p.services||[{name:'Soch kesish',price:p.price}],sel=S.selectedServices.length?S.selectedServices:[list[0]],total=sel.reduce((s,x)=>s+x.price,0);
  db.bookings.push({id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),barber:m.barber,shop:p.shop,client:S.user.login,clientPhone:S.user.phone,
    date:m.date,time:m.time,price:total,deposit:total/2,selectedServices:sel,status:'pending',created:Date.now()});
  save(db);S.modal=null;S.tab='mine';S.viewing=null;toast("So'rov yuborildi",'ok');render();
}

/* ---------- RENDER ---------- */
function render(){
  const keep={};['a_phone','a_pass','s_q','s_dist','admin_monthly_fee','admin_card_num','admin_card_holder','crm_expense_input','new_admin_pass'].forEach(id=>{if($(id))keep[id]=$(id).value});
  document.querySelectorAll('[id^="days_input_"]').forEach(el=>{keep[el.id]=el.value});
  $('app').innerHTML=S.user?appView():authView();
  Object.entries(keep).forEach(([id,v])=>{if($(id))$(id).value=v});
  lastPending=pendingCount();
}

async function initApp(){
  await loadAsync();
  S.user=currentUser();
  if(S.user&&!S.tab)S.tab=firstTab(S.user);
  lastPending=pendingCount();
  render();
}
initApp();

window.addEventListener('storage',e=>{
  if(e.key===SES){S.user=currentUser();if(!S.user){S.viewing=null;S.modal=null}else if(!S.tab)S.tab=firstTab(S.user);render()}
  if(e.key===THEME_KEY){applyTheme(e.newValue||'dark');render()}
});

setInterval(async()=>{
  await loadAsync();
  if(S.user&&!S.modal&&!S.resetModalUser&&!formOpen()&&document.activeElement?.id!=='s_q'){
    const n=pendingCount();
    if(n>lastPending)toast("Yangi to'lov so'rovi!",'ok');
    render();lastPending=n;
  }
},5000);
</script>
</body>
</html>
